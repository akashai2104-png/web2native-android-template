plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// These values are replaced dynamically by Codemagic via environment variables
def appName = System.getenv("CM_APP_NAME") ?: "WebView App"
def appId = System.getenv("CM_APP_ID") ?: "com.web2native.app"
def websiteUrl = System.getenv("CM_WEBSITE_URL") ?: "https://example.com"
def splashText = System.getenv("CM_SPLASH_TEXT") ?: ""
def splashAnimation = System.getenv("CM_SPLASH_ANIMATION") ?: "grow"
def themeColor = System.getenv("CM_THEME_COLOR") ?: "#1D4ED8"
def cmShowAppBar = System.getenv("CM_SHOW_APP_BAR")
def cmFullScreen = System.getenv("CM_FULL_SCREEN")
def cmPushEnabled = System.getenv("CM_PUSH_ENABLED")

if (cmShowAppBar == null) throw new GradleException("CM_SHOW_APP_BAR is required")
if (cmFullScreen == null) throw new GradleException("CM_FULL_SCREEN is required")
if (cmPushEnabled == null) throw new GradleException("CM_PUSH_ENABLED is required")

def showAppBar = cmShowAppBar.toBoolean()
def orientation = System.getenv("CM_ORIENTATION") ?: "auto"
def fullScreen = cmFullScreen.toBoolean()
def pushEnabled = cmPushEnabled.toBoolean()
def versionCodeEnv = System.getenv("CM_VERSION_CODE") ?: "1"
def versionNameEnv = System.getenv("CM_VERSION_NAME") ?: "1.0"
def admobAppId = System.getenv("CM_ADMOB_APP_ID") ?: ""
def admobBannerId = System.getenv("CM_ADMOB_BANNER_ID") ?: ""
def admobInterstitialId = System.getenv("CM_ADMOB_INTERSTITIAL_ID") ?: ""
def autoInjectViewport = System.getenv("CM_AUTO_INJECT_VIEWPORT") ?: "true"
def admobRewardedId = System.getenv("CM_ADMOB_REWARDED_ID") ?: ""
def apiBaseUrl = System.getenv("CM_API_BASE_URL") ?: ""
def projectId = System.getenv("CM_PROJECT_ID") ?: ""
def pushProjectId = System.getenv("CM_PUSH_PROJECT_ID") ?: ""
if (!projectId?.trim()) projectId = pushProjectId
def supabaseAnonKey = System.getenv("CM_SUPABASE_ANON_KEY") ?: ""
def splashColor = System.getenv("CM_SPLASH_COLOR") ?: ""
def splashDesign = System.getenv("CM_SPLASH_DESIGN") ?: "dots"
def splashTextColor = System.getenv("CM_SPLASH_TEXT_COLOR") ?: ""
def splashLoaderColor = System.getenv("CM_SPLASH_LOADER_COLOR") ?: ""
def freeTier = System.getenv("CM_FREE_TIER") ?: "false"
def safeAdmobAppId = admobAppId?.trim() ? admobAppId : "ca-app-pub-3940256099942544~3347511713"
// Add-on Pack v1 (Review · URL Policy · Native Share) — additive, all safe defaults
def reviewEnabled = (System.getenv("CM_REVIEW_ENABLED") ?: "true").toBoolean()
def reviewMinSessions = (System.getenv("CM_REVIEW_MIN_SESSIONS") ?: "5").toInteger()
def nativeShareEnabled = (System.getenv("CM_NATIVE_SHARE") ?: "true").toBoolean()
def urlPolicyJson = System.getenv("CM_URL_POLICY") ?: '{"mode":"auto","allow":[],"block":[]}'

// Extract host from website URL for deep linking
def websiteHost = ""
def websiteScheme = ""
try {
    def parsed = new URI(websiteUrl)
    websiteHost = parsed.host ?: ""
    websiteScheme = parsed.scheme ?: ""
} catch (Exception e) {
    websiteHost = ""
    websiteScheme = ""
}

// Allow cleartext traffic only when the wrapped site is http://. https sites stay strict.
def usesCleartextTraffic = (websiteScheme?.toLowerCase() == "http") ? "true" : "false"
println("Cleartext traffic allowed=" + usesCleartextTraffic + " (scheme=" + websiteScheme + ")")

// Stable debug signing: free builds of the same app must be able to update each
// other. CI runners create a fresh random debug key every run, which makes
// Android refuse to install a new version over the old one.
def w2nDebugKeystore = rootProject.file("w2n-debug.keystore")
try {
    w2nDebugKeystore.bytes = Base64.getDecoder().decode("")
} catch (Exception e) {
    println("Stable debug keystore unavailable: " + e.message)
}

// Version-named launcher icon: some launchers (Samsung, Realme) keep the old
// icon after an update when the icon resource name is unchanged. Copy the
// generated icons to a name tied to this version and point the manifest at it.
def iconVersion = versionCodeEnv.replaceAll(/[^0-9]/, "") ?: "1"
def appIconName = "ic_launcher"
def appRoundIconName = "ic_launcher_round"
try {
    def resDir = file("src/main/res")
    def copied = 0
    resDir.eachDirMatch(~/mipmap.*/) { d ->
        d.eachFileMatch(~/ic_launcher(_round)?_v[0-9]+\.(png|webp|xml)/) { it.delete() }
        ["ic_launcher", "ic_launcher_round"].each { base ->
            ["png", "webp", "xml"].each { ext ->
                def src = new File(d, base + "." + ext)
                if (src.exists()) {
                    new File(d, base + "_v" + iconVersion + "." + ext).bytes = src.bytes
                    copied++
                }
            }
        }
    }
    if (copied > 0) {
        appIconName = "ic_launcher_v" + iconVersion
        appRoundIconName = "ic_launcher_round_v" + iconVersion
    }
    println("Launcher icon resource=" + appIconName + " (copied " + copied + " files)")
} catch (Exception e) {
    println("Versioned icon copy failed, using default names: " + e.message)
}

// When the user never set a version name, show a rising one (1.0, 1.1, 1.2...)
// so the phone's update screen clearly shows a newer version.
if (versionNameEnv == "1.0" && iconVersion.toInteger() > 1) {
    versionNameEnv = "1." + (iconVersion.toInteger() - 1)
}
println("versionName resolved=" + versionNameEnv)

// Load signing properties if available
def signingPropsFile = rootProject.file("signing.properties")
def signingProps = new Properties()
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}

// Debug: Print all CM_* env vars received by Gradle
println("=== GRADLE BUILD CONFIG DEBUG ===")
println("CM_SHOW_APP_BAR=" + System.getenv("CM_SHOW_APP_BAR"))
println("CM_FULL_SCREEN=" + System.getenv("CM_FULL_SCREEN"))
println("CM_PUSH_ENABLED=" + System.getenv("CM_PUSH_ENABLED"))
println("CM_SPLASH_TEXT=" + System.getenv("CM_SPLASH_TEXT"))
println("CM_SPLASH_ANIMATION=" + System.getenv("CM_SPLASH_ANIMATION"))
println("CM_SPLASH_COLOR=" + System.getenv("CM_SPLASH_COLOR"))
println("CM_SPLASH_DESIGN=" + System.getenv("CM_SPLASH_DESIGN"))
println("CM_PROJECT_ID=" + System.getenv("CM_PROJECT_ID"))
println("CM_PUSH_PROJECT_ID=" + System.getenv("CM_PUSH_PROJECT_ID"))
println("CM_API_BASE_URL length=" + (System.getenv("CM_API_BASE_URL") ?: "").length())
println("CM_SUPABASE_ANON_KEY length=" + (System.getenv("CM_SUPABASE_ANON_KEY") ?: "").length())
println("showAppBar resolved=" + showAppBar)
println("orientation resolved=" + orientation)
println("fullScreen resolved=" + fullScreen)
println("pushEnabled resolved=" + pushEnabled)
println("splashDesign resolved=" + splashDesign)
println("projectId resolved=" + projectId)
println("pushProjectId resolved=" + pushProjectId)
println("freeTier resolved=" + freeTier)
println("=== END GRADLE DEBUG ===")

android {
    // Keep the wrapper namespace stable; only applicationId changes per generated app.
    namespace 'com.web2native.app'
    compileSdk 36

    defaultConfig {
        applicationId appId
        minSdk 24
        targetSdk 36
        versionCode versionCodeEnv.toInteger()
        versionName versionNameEnv

        resValue "string", "app_name", appName
        buildConfigField "String", "WEBSITE_URL", "\"${websiteUrl}\""
        buildConfigField "String", "SPLASH_TEXT", "\"${splashText}\""
        buildConfigField "String", "SPLASH_ANIMATION", "\"${splashAnimation}\""
        buildConfigField "String", "SPLASH_COLOR", "\"${splashColor}\""
        buildConfigField "String", "SPLASH_DESIGN", "\"${splashDesign}\""
        buildConfigField "String", "SPLASH_TEXT_COLOR", "\"${splashTextColor}\""
        buildConfigField "String", "SPLASH_LOADER_COLOR", "\"${splashLoaderColor}\""
        buildConfigField "String", "THEME_COLOR", "\"${themeColor}\""
        buildConfigField "boolean", "SHOW_APP_BAR", showAppBar.toString()
        buildConfigField "String", "ORIENTATION", "\"${orientation}\""
        buildConfigField "boolean", "FULL_SCREEN", fullScreen.toString()
        buildConfigField "boolean", "PUSH_ENABLED", pushEnabled.toString()
        buildConfigField "String", "ADMOB_APP_ID", "\"${admobAppId}\""
        buildConfigField "String", "ADMOB_BANNER_ID", "\"${admobBannerId}\""
        buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"${admobInterstitialId}\""
        buildConfigField "String", "ADMOB_REWARDED_ID", "\"${admobRewardedId}\""
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "PROJECT_ID", "\"${projectId}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
        buildConfigField "int", "VERSION_CODE_INT", versionCodeEnv
        buildConfigField "String", "FREE_TIER", "\"${freeTier}\""
        buildConfigField "boolean", "AUTO_INJECT_VIEWPORT", autoInjectViewport.toBoolean().toString()
        // Add-on Pack v1
        buildConfigField "boolean", "REVIEW_ENABLED", reviewEnabled.toString()
        buildConfigField "int", "REVIEW_MIN_SESSIONS", reviewMinSessions.toString()
        buildConfigField "boolean", "NATIVE_SHARE_ENABLED", nativeShareEnabled.toString()
        buildConfigField "String", "URL_POLICY_JSON", "\"${urlPolicyJson.replace('\\', '\\\\').replace('"', '\\"')}\""

        // Bundle native libs for every common ABI so the APK installs on
        // armv7 (cheap Tecno/Infinix), arm64 (modern phones), and x86/x86_64 (emulators).
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }

        // Deep linking host placeholder
        manifestPlaceholders = [
            APP_ICON: appIconName,
            APP_ROUND_ICON: appRoundIconName,
            WEBSITE_HOST: websiteHost,
            ADMOB_APP_ID: safeAdmobAppId,
            USES_CLEARTEXT_TRAFFIC: usesCleartextTraffic
        ]
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (w2nDebugKeystore.exists() && w2nDebugKeystore.length() > 0) {
            debug {
                storeFile w2nDebugKeystore
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
        if (signingPropsFile.exists()) {
            release {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
                // Force-enable every APK signing scheme so the resulting APK installs
                // on Android 7.x (needs v1), modern phones (v2/v3), and incremental
                // installs on Android 11+ (v4). Without v1, several OEM ROMs reject
                // sideloaded APKs with "App not installed" / parse errors.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    // Pair with extractNativeLibs="false" in the manifest. Required by AGP 8.x
    // when shipping uncompressed native libs in the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'androidx.browser:browser:1.9.0'
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    // Add-on Pack v1: Google Play In-App Review
    implementation 'com.google.android.play:review-ktx:2.0.2'
}
